<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteMind</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= AUTH ================= -->
<section id="auth-view" class="view">
  <div class="auth-wrap">
    <div class="brand-block">
      <span class="brand-icon-lg"></span>
      <h1>NoteMind</h1>
      <p class="tagline">Your notes. A smarter you.</p>
    </div>

    <div class="auth-card">
      <form id="login-form" class="auth-form">
        <h2>Sign in to your account</h2>
        <label>Email</label>
        <div class="input-icon"><span></span><input type="email" id="login-email" placeholder="you@example.com" required></div>
        <label>Password</label>
        <div class="input-icon">
          <span></span>
          <input type="password" id="login-password" placeholder="Enter your password" required>
          <button type="button" class="eye-toggle" data-target="login-password">👁</button>
        </div>
        <div class="form-row">
          <label class="checkbox"><input type="checkbox" id="remember-me" checked> Remember me</label>
          <a href="#" id="forgot-password">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary btn-block">Login</button>
        <p class="switch">Don't have an account? <a href="#" data-tab="register">Sign up</a></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <h2>Create your account</h2>
        <label>Email</label>
        <div class="input-icon"><span></span><input type="email" id="register-email" placeholder="you@example.com" required></div>
        <label>Password</label>
        <div class="input-icon">
          <span></span>
          <input type="password" id="register-password" placeholder="Create a password (min 8 chars)" required minlength="8">
          <button type="button" class="eye-toggle" data-target="register-password">👁</button>
        </div>
        <button type="submit" class="btn-primary btn-block">Sign Up</button>
        <p class="switch">Already have an account? <a href="#" data-tab="login">Login</a></p>
      </form>

      <p id="auth-error" class="error hidden"></p>
    </div>

    <p class="footer-quote">Better notes. A brighter you.</p>
  </div>
</section>

<!-- ================= APP ================= -->
<section id="app-view" class="view hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon"></span><h1>NoteMind</h1></div>
    <nav class="nav">
      <button class="nav-item active" data-page="dashboard">Dashboard</button>
      <button class="nav-item" data-page="notes">Notes</button>
      <button class="nav-item" data-page="reminders">Reminders</button>
    </nav>
    <div class="nav nav-bottom">
      <button class="nav-item" data-page="profile">Profile</button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div>
        <h2 id="page-title">Welcome back!</h2>
        <p id="page-subtitle" class="page-subtitle"></p>
      </div>
      <div class="topbar-actions">
        <div class="input-icon search-box"><span>🔍</span><input type="search" id="global-search" placeholder="Search notes..."></div>
        <button class="btn-primary" id="topbar-new-note">+ New Note</button>
      </div>
    </header>

    <main id="content-area" class="content-area"></main>
  </div>
</section>

<div id="toast-container" class="toast-container"></div>

<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/notes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
