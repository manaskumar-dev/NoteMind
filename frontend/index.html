<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Notes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ---------- AUTH VIEW ---------- -->
<section id="auth-view" class="view">
  <div class="auth-card">
    <h1>AI Notes</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="email" id="register-email" placeholder="Email" required>
      <input type="password" id="register-password" placeholder="Password (min 8 chars)" required minlength="8">
      <button type="submit">Create account</button>
    </form>

    <p id="auth-error" class="error hidden"></p>
  </div>
</section>

<!-- ---------- APP VIEW ---------- -->
<section id="app-view" class="view hidden">
  <header class="app-header">
    <h1>AI Notes</h1>
    <div class="header-actions">
      <input type="search" id="search-input" placeholder="Search notes...">
      <select id="tag-filter"><option value="">All tags</option></select>
      <label class="upload-btn">
        Upload PDF
        <input type="file" id="pdf-input" accept="application/pdf" hidden>
      </label>
      <button id="new-note-btn">+ New note</button>
      <button id="logout-btn" class="secondary">Logout</button>
    </div>
  </header>

  <main class="app-main">
    <aside id="notes-list" class="notes-list"></aside>

    <section id="editor-panel" class="editor-panel hidden">
      <input type="text" id="note-title" placeholder="Note title">
      <input type="text" id="note-tags" placeholder="tags, comma, separated">

      <div class="editor-toolbar">
        <button id="save-btn">Save</button>
        <button id="delete-btn" class="danger">Delete</button>
        <button id="summarize-btn">AI Summarize</button>
        <button id="refine-btn">AI Refine Grammar</button>
        <button id="reminder-btn">Start Review Reminder</button>
        <span id="autosave-status"></span>
      </div>

      <div class="editor-split">
        <textarea id="note-content" placeholder="Write markdown here..."></textarea>
        <div id="note-preview" class="preview"></div>
      </div>

      <div id="reminder-info" class="reminder-info hidden"></div>
      <div id="ai-result" class="ai-result hidden">
        <div class="ai-result-header">
          <strong id="ai-result-label"></strong>
          <button id="ai-apply-btn">Insert into note</button>
          <button id="ai-dismiss-btn">Dismiss</button>
        </div>
        <p id="ai-result-text"></p>
      </div>
    </section>
  </main>
</section>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/notes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
